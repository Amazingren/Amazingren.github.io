<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journey</title>
  <script>
    (function(){
      var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
      document.documentElement.setAttribute('data-theme',t);
    })();
  </script>
  <style>
    :root {
      --g-sphere:#f8fafc; --g-edge:#e5e7eb; --g-dot:#cbd5e1;
      --g-arc:#dc2626; --g-cap:#6b7280; --g-strong:#374151;
    }
    [data-theme="dark"] {
      --g-sphere:#162032; --g-edge:#374151; --g-dot:#4b5563;
      --g-arc:#f87171; --g-cap:#9ca3af; --g-strong:#e5e7eb;
    }
    html, body {
      margin: 0;
      background: transparent;  /* blend with whatever the main page shows behind it */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .journey {
      max-width: 560px;
      margin: 0 auto;
      padding: 8px 16px 12px;
      text-align: center;
    }
    .journey canvas {
      width: 100%;
      max-width: 260px;
      margin: 0 auto;
      aspect-ratio: 1;
      display: block;
      cursor: grab;
    }
    .journey canvas:active { cursor: grabbing; }
    .journey-cap {
      font-size: 13px;
      line-height: 1.6;
      color: var(--g-cap);
      margin-top: 4px;
      text-wrap: balance;
    }
    .journey-cap strong { color: var(--g-strong); }
  </style>
</head>
<body>
  <div class="journey">
    <canvas id="journey-globe" aria-label="Globe showing my academic journey"></canvas>
    <div class="journey-cap">
      Changsha → Beijing → Trento · Pisa → Zürich → Sofia → Abu&nbsp;Dhabi → <strong>Lausanne</strong>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
(function(){
  /* stops in chronological order: [name, [lon, lat]] */
  var stops = [
    ['Changsha',  [112.94, 28.23]],
    ['Beijing',   [116.31, 39.99]],
    ['Trento',    [11.12, 46.07]],
    ['Pisa',      [10.40, 43.72]],
    ['Zürich',    [8.55, 47.38]],
    ['Sofia',     [23.32, 42.70]],
    ['Abu Dhabi', [54.62, 24.43]],
    ['Lausanne',  [6.57, 46.52]]
  ];

  var canvas = document.getElementById('journey-globe');
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1, size = 0;
  var proj = d3.geoOrthographic().clipAngle(90).precision(0.3);
  var path = d3.geoPath(proj, ctx);
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var dots = [], base = -60, phase = 0, dragging = false, timer = null, lastDraw = -1e9;

  /* sway the globe between Europe and East Asia so the journey stays in view */
  function lonFromPhase(p){ return base - 45 * Math.sin(p); }
  var rot = [lonFromPhase(0), -25];

  function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  function resize(){
    size = canvas.clientWidth;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    proj.translate([size / 2, size / 2]).scale(size / 2 - 4);
  }

  function draw(now){
    var c = { sphere: css('--g-sphere'), edge: css('--g-edge'), dot: css('--g-dot'), arc: css('--g-arc') };
    proj.rotate(rot);
    var center = [-rot[0], -rot[1]];
    ctx.clearRect(0, 0, size, size);

    /* sphere */
    ctx.beginPath(); path({type: 'Sphere'});
    ctx.fillStyle = c.sphere; ctx.fill();
    ctx.strokeStyle = c.edge; ctx.lineWidth = 1; ctx.stroke();

    /* land as dots (front hemisphere only) */
    ctx.fillStyle = c.dot;
    for (var i = 0; i < dots.length; i++) {
      if (d3.geoDistance(dots[i], center) > 1.53) continue;
      var p = proj(dots[i]);
      ctx.fillRect(p[0] - 0.9, p[1] - 0.9, 1.8, 1.8);
    }

    /* great-circle arcs between consecutive stops */
    ctx.strokeStyle = c.arc; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.85;
    for (var k = 1; k < stops.length; k++) {
      ctx.beginPath();
      path({type: 'LineString', coordinates: [stops[k - 1][1], stops[k][1]]});
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    /* stops; the current one (last) pulses */
    var pulse = still ? 0 : (now / 1400) % 1;
    stops.forEach(function(s, k){
      if (d3.geoDistance(s[1], center) > 1.5) return;
      var p = proj(s[1]), last = k === stops.length - 1;
      ctx.beginPath(); ctx.arc(p[0], p[1], last ? 4.5 : 3, 0, 2 * Math.PI);
      ctx.fillStyle = c.arc; ctx.fill();
      if (last && !still) {
        ctx.beginPath(); ctx.arc(p[0], p[1], 4.5 + 7 * pulse, 0, 2 * Math.PI);
        ctx.strokeStyle = c.arc; ctx.globalAlpha = 1 - pulse; ctx.stroke(); ctx.globalAlpha = 1;
      }
    });
  }

  function tick(elapsed){
    if (elapsed - lastDraw < 33) return;  /* ~30 fps is plenty for a slow sway */
    lastDraw = elapsed;
    if (!dragging && !still) {
      phase += 0.006;
      rot[0] = lonFromPhase(phase);
    }
    draw(elapsed);
  }

  function start(){ if (!timer && dots.length) timer = d3.timer(tick); }
  function stop(){ if (timer) { timer.stop(); timer = null; } }

  resize();

  /* land dots on a ~2° grid, precomputed from world-atlas land-110m: flat [lon, lat, lon, lat, ...] */
  d3.json('journey-dots.json').then(function(flat){
    for (var i = 0; i < flat.length; i += 2) dots.push([flat[i], flat[i + 1]]);
    draw(0);
    /* only animate while visible */
    new IntersectionObserver(function(entries){
      entries[0].isIntersecting ? start() : stop();
    }).observe(canvas);
  });

  /* mouse drag to spin; touch is left to the page so phones can still scroll past */
  d3.select(canvas).call(d3.drag()
    .touchable(false)
    .on('start', function(){ dragging = true; })
    .on('drag', function(e){
      rot[0] += e.dx * 0.4;
      rot[1] = Math.max(-60, Math.min(60, rot[1] - e.dy * 0.4));
      if (!timer) draw(0);
    })
    .on('end', function(){
      dragging = false;
      /* resume swaying around wherever the globe was left */
      base = rot[0] + 45 * Math.sin(phase);
    }));

  window.addEventListener('resize', function(){ resize(); draw(0); });
  window.addEventListener('message', function(e){
    if (e.data && e.data.type === 'theme') {
      document.documentElement.setAttribute('data-theme', e.data.theme);
      localStorage.setItem('theme', e.data.theme);
      draw(0);
    }
  });
})();
</script>
</body>
</html>
